<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance Calculator | AttendX</title>

    <link rel="icon"
          href="assets/logo.png">

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<div id="particles"></div>


<header class="navbar">

    <a href="index.html" class="brand">
    <img src="assets/logo.png" alt="AttendX Logo">
    <span class="brand-name">
        A<span>t</span><span class="glow-t">T</span>endX
    </span>
</a>

    <nav>

        <a href="index.html">Home</a>

        <a href="calculator.html">Calculator</a>

        <a href="profile.html">Profile</a>

        <a href="about.html">About</a>

    </nav>

</header>


<main class="page">

    <div class="panel">

        <p class="eyebrow">
            SMART CALCULATOR
        </p>

        <h1>
            Attendance Planner
        </h1>

        <p>
            Tell AttendX your academic period,
            current attendance and target.
            We'll calculate the rest.
        </p>


        <div class="form-grid">


            <div class="input-group">

                <label>Period Start</label>

                <input
                    type="date"
                    id="startDate">

            </div>


            <div class="input-group">

                <label>Period End</label>

                <input
                    type="date"
                    id="endDate">

            </div>


            <div class="input-group">

                <label>Days Already Held</label>

                <input
                    type="number"
                    id="heldDays"
                    min="0"
                    placeholder="Example: 100">

            </div>


            <div class="input-group">

                <label>Days You Attended</label>

                <input
                    type="number"
                    id="presentDays"
                    min="0"
                    placeholder="Example: 78">

            </div>


            <div class="input-group">

                <label>Target Attendance %</label>

                <input
                    type="number"
                    id="target"
                    min="1"
                    max="100"
                    value="75">

            </div>


            <div class="input-group">

                <label>Weekly Holidays</label>

                <select id="weeklyHoliday">

                    <option value="0">
                        Sunday
                    </option>

                    <option value="6">
                        Saturday + Sunday
                    </option>

                    <option value="none">
                        None
                    </option>

                </select>

            </div>


            <div class="input-group full">

                <label>
                    Holidays
                    <small>
                        Enter dates separated by commas.
                    </small>
                </label>

                <input
                    type="text"
                    id="holidays"
                    placeholder="2026-08-15, 2026-08-28">

            </div>


            <div class="full">

                <button
                    class="primary-btn"
                    onclick="calculateAttendance()">

                    Calculate Attendance →

                </button>

            </div>

        </div>


        <div
            id="results"
            style="display:none;">

            <div class="result-grid">

                <div class="result">

                    <small>Working Days</small>

                    <strong id="workingDays">0</strong>

                </div>


                <div class="result">

                    <small>Required Present</small>

                    <strong id="requiredPresent">0</strong>

                </div>


                <div class="result">

                    <small>Maximum Absence</small>

                    <strong id="maxAbsent">0</strong>

                </div>


                <div class="result">

                    <small>Projected %</small>

                    <strong id="projected">0%</strong>

                </div>

            </div>


            <div
                class="message"
                id="message">
            </div>

        </div>

    </div>

</main>


<script src="js/app.js"></script>

<script src="js/calculator.js"></script>

</body>

</html>
