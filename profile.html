<!DOCTYPE html>
<html lang="en">

<head>

<link rel="icon"
href="assets/logo.png">

href="css/style.css">

<body class="profile-page">

<div id="particles"></div>


<header class="navbar">

<a href="index.html" class="brand">

<img
src="assets/logo.png"
alt="AttendX Logo">

<span>
At<span>T</span>endX
</span>

</a>


<nav>

</nav>

<main class="page">

<div class="panel">


<p class="eyebrow">
FINAL STEP
</p>


<h1>
Choose Your Avatar
</h1>


<p>
Your account details are already saved.
Choose an avatar to complete your AttendX profile.
</p>



<!-- ================= PROFILE PREVIEW ================= -->

<div class="profile-header">

<img
id="profileImage"
class="profile-photo"
src="assets/avatars/avatar1.png"
alt="Profile Avatar">


<div>

<p class="eyebrow">
STUDENT PROFILE
</p>


<h1 id="profileName">
Student
</h1>


<p id="profileClass">
Class • Target: 75%
</p>

</div>

</div>



<!-- ================= AVATARS ================= -->

<h3>
Choose your avatar
</h3>


<div class="avatar-grid">


<img
class="avatar-choice"
src="assets/avatars/avatar1.png"
data-avatar="assets/avatars/avatar1.png"
alt="Avatar 1">


<img
class="avatar-choice"
src="assets/avatars/avatar2.png"
data-avatar="assets/avatars/avatar2.png"
alt="Avatar 2">


<img
class="avatar-choice"
src="assets/avatars/avatar3.png"
data-avatar="assets/avatars/avatar3.png"
alt="Avatar 3">


<img
class="avatar-choice"
src="assets/avatars/avatar4.png"
data-avatar="assets/avatars/avatar4.png"
alt="Avatar 4">


<img
class="avatar-choice"
src="assets/avatars/avatar5.png"
data-avatar="assets/avatars/avatar5.png"
alt="Avatar 5">


<img
class="avatar-choice"
src="assets/avatars/avatar6.png"
data-avatar="assets/avatars/avatar6.png"
alt="Avatar 6">


</div>



<!-- ================= PROCEED ================= -->

<div class="profile-actions">

<button
class="primary-btn"
onclick="proceedToCalculator()">

Proceed →

</button>

</div>



</div>

</main>



<script src="js/app.js"></script>

<script src="js/login.js"></script>
