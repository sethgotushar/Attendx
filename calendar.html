<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Calendar | AttendX</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/logo.png"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body class="calendar-page">

    <!-- PARTICLES -->
    <div id="particles"></div>


    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <header class="navbar">

        <a
            href="index.html"
            class="brand"
        >

            <img
                src="assets/logo.png"
                alt="AttendX"
            >

            <span>
                At<span>T</span>endX
            </span>

        </a>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="calculator.html">
                Calculator
            </a>

            <a
                href="calendar.html"
                class="active"
            >
                Calendar
            </a>

            <a href="about.html">
                About
            </a>

        </nav>

    </header>


    <!-- =====================================================
         MAIN CALENDAR
         ===================================================== -->

    <main class="calendar-container">


        <!-- =================================================
             PROFILE HEADER
             ================================================= -->

        <section class="calendar-profile">

            <button
                class="profile-avatar-button"
                id="editProfileButton"
                type="button"
                title="Edit Profile"
            >

                <img
                    id="calendarAvatar"
                    src="assets/avatars/avatar1.png"
                    alt="Profile"
                >

            </button>


            <div class="calendar-profile-info">

                <p class="eyebrow">
                    ATTENDX STUDENT
                </p>

                <h1 id="calendarName">
                    Student
                </h1>

                <p id="calendarClass">
                    Class
                </p>

            </div>


            <div class="calendar-target">

                <span>
                    TARGET
                </span>

                <strong id="calendarTarget">
                    75%
                </strong>

            </div>

        </section>



        <!-- =================================================
             ACADEMIC PERIOD
             ================================================= -->

        <section class="calendar-period">

            <div>

                <span>
                    ACADEMIC PERIOD
                </span>

                <strong id="calendarPeriod">
                    01/04/2026 — 31/12/2026
                </strong>

            </div>


            <button
                id="editPeriodButton"
                class="calendar-edit-btn"
                type="button"
            >
                Edit Profile
            </button>

        </section>



        <!-- =================================================
             MONTHS
             ================================================= -->

        <section
            id="monthsContainer"
            class="months-container"
        ></section>



        <!-- =================================================
             ATTENDANCE SUMMARY
             ================================================= -->

        <section class="attendance-summary">

            <div class="summary-title">

                <p class="eyebrow">
                    ATTENDANCE SUMMARY
                </p>

                <h2>
                    Your <span>Progress</span>
                </h2>

            </div>


            <div class="summary-grid">


                <!-- PRESENT -->

                <div class="summary-card">

                    <span>
                        PRESENT
                    </span>

                    <strong id="presentCount">
                        0
                    </strong>

                </div>


                <!-- ABSENT -->

                <div class="summary-card">

                    <span>
                        ABSENT
                    </span>

                    <strong id="absentCount">
                        0
                    </strong>

                </div>


                <!-- HOLIDAY -->

                <div class="summary-card">

                    <span>
                        HOLIDAY
                    </span>

                    <strong id="holidayCount">
                        0
                    </strong>

                </div>


                <!-- ATTENDANCE -->

                <div class="summary-card percentage-card">

                    <span>
                        ATTENDANCE
                    </span>

                    <strong id="currentPercentage">
                        0%
                    </strong>

                </div>

            </div>

        </section>

    </main>



    <!-- =====================================================
         DATE ATTENDANCE MENU
         ===================================================== -->

    <div
        id="dateMenu"
        class="date-menu"
    >

        <div class="date-menu-box">


            <!-- CLOSE -->

            <button
                class="close-date-menu"
                id="closeDateMenu"
                type="button"
                aria-label="Close"
            >
                ×
            </button>


            <p class="eyebrow">
                MARK ATTENDANCE
            </p>


            <h3 id="selectedDateText">
                Select Date
            </h3>


            <!-- =================================================
                 ATTENDANCE OPTIONS
                 ================================================= -->

            <div class="attendance-options">


                <!-- PRESENT -->

                <button
                    class="attendance-option present-option"
                    data-status="present"
                    type="button"
                >

                    <span>
                        ×
                    </span>

                    Present

                </button>



                <!-- ABSENT -->

                <button
                    class="attendance-option absent-option"
                    data-status="absent"
                    type="button"
                >

                    <span>
                        ×
                    </span>

                    Absent

                </button>



                <!-- HOLIDAY -->

                <button
                    class="attendance-option holiday-option"
                    data-status="holiday"
                    type="button"
                >

                    <span>
                        ×
                    </span>

                    Holiday

                </button>



                <!-- NONE / CLEAR -->

                <button
                    class="attendance-option none-option"
                    data-status="none"
                    type="button"
                >

                    <span>
                        ↺
                    </span>

                    None

                </button>

            </div>

        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/app.js"></script>

    <script src="js/calendar.js"></script>

</body>

</html>
