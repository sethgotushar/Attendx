<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Account | AttendX</title>

<link rel="icon"
href="assets/logo.png">

<link rel="stylesheet"
href="css/style.css">

</head>


<body>

<div id="particles"></div>


<header class="navbar">

<a href="index.html" class="brand">
    <img src="assets/logo.png" alt="AttendX Logo">
    <span class="brand-name">
        At</span><span class="glow-t">T</span>endX
    </span>
</a>

</header>


<main class="page">

<div class="panel">

<p class="eyebrow">
YOUR ATTENDX ACCOUNT
</p>

<h1>
Create Profile
</h1>

<p>
Create a local AttendX profile and save
your attendance preferences on this device.
</p>


<div class="form-grid">


<div class="input-group full">

<label>Your Name</label>

<input
id="username"
type="text"
placeholder="Enter your name">

</div>


<div class="input-group">

<label>Class</label>

<input
id="className"
type="text"
placeholder="Example: Class 12">

</div>


<div class="input-group">

<label>Target Attendance</label>

<input
id="targetAttendance"
type="number"
value="75"
min="1"
max="100">

</div>


<div class="full">

<button
class="primary-btn"
onclick="createAccount()">

Create My Profile →

</button>

</div>


</div>

<div
id="accountMessage"
class="message">
</div>

</div>

</main>


<script src="js/app.js"></script>

<script src="js/login.js"></script>

</body>

</html>
