<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Account | AttendX</title>

<link rel="icon"
href="assets/logo.png">

<link rel="stylesheet"
href="css/style.css">

</head>


<body>

<div id="particles"></div>


<header class="navbar">

<a href="index.html" class="brand">

<img src="assets/logo.png">

<span>
At<span>T</span>endX
</span>

</a>

</header>


<main class="page">

<div class="panel">

<p class="eyebrow">
YOUR ATTENDX ACCOUNT
</p>

<h1>
Create Profile
</h1>

<p>
Create a local AttendX profile and save
your attendance preferences on this device.
</p>


<div class="form-grid">


<!-- NAME -->

<div class="input-group full">

<label>Your Name</label>

<input
id="username"
type="text"
placeholder="Enter your name">

</div>


<!-- CLASS -->

<div class="input-group">

<label>Class</label>

<input
id="className"
type="text"
placeholder="Example: Class 12">

</div>


<!-- CURRENT ATTENDANCE -->

<div class="input-group">

<label>Current Attendance</label>

<input
id="currentAttendance"
type="number"
placeholder="Example: 78"
min="0"
max="100">

</div>


<!-- TARGET ATTENDANCE -->

<div class="input-group">

<label>Target Attendance</label>

<input
id="targetAttendance"
type="number"
value="75"
min="1"
max="100">

</div>


<!-- START DATE -->

<div class="input-group">

<label>Period Start</label>

<input
id="startDate"
type="date"
value="2026-04-01">

</div>


<!-- END DATE -->

<div class="input-group">

<label>Period End</label>

<input
id="endDate"
type="date"
value="2026-12-31">

</div>


<!-- BUTTON -->

<div class="full">

<button
class="primary-btn"
onclick="createAccount()">

Create My Profile →

</button>

</div>


</div>


<div
id="accountMessage"
class="message">
</div>

</div>

</main>


<script src="js/app.js"></script>

<script src="js/login.js"></script>

</body>

</html>
